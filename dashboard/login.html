<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Sign in</title>
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("theme");
                    if (saved === "light" || saved === "dark") {
                        document.documentElement.setAttribute("data-theme", saved);
                    }
                } catch (e) {}
            })();
        </script>
        <style>
            :root {
                --bg: #f7f6f3;
                --fg: #17161a;
                --muted: #6f6d72;
                --accent: #c9754a;
                --accent-fg: #17161a;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0d0d0f;
                    --fg: #f2f1ee;
                    --muted: #918f95;
                    --accent: #d98b62;
                    --accent-fg: #0d0d0f;
                }
            }
            :root[data-theme="dark"] {
                --bg: #0d0d0f;
                --fg: #f2f1ee;
                --muted: #918f95;
                --accent: #d98b62;
                --accent-fg: #0d0d0f;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--fg);
                font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
            }
            form { width: min(320px, 86vw); display: grid; gap: 14px; }
            h1 { font-size: 1.25rem; margin: 0; }
            input, button {
                font: inherit;
                padding: 10px 12px;
                border-radius: 8px;
                border: 1px solid var(--muted);
                background: transparent;
                color: var(--fg);
            }
            input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
            button {
                background: var(--accent);
                color: var(--accent-fg);
                border-color: var(--accent);
                cursor: pointer;
                font-weight: 600;
            }
            #error { color: var(--accent); min-height: 1.2em; margin: 0; font-size: 0.9rem; }
        </style>
    </head>
    <body>
        <form id="login-form">
            <h1>Dashboard</h1>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus />
            <button type="submit">Sign in</button>
            <p id="error" role="alert"></p>
        </form>
        <script>
            document.getElementById("login-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const error = document.getElementById("error");
                error.textContent = "";
                try {
                    const res = await fetch("/api/dashboard/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ password: document.getElementById("password").value }),
                    });
                    if (res.status === 204) location.reload();
                    else error.textContent = res.status === 401 ? "Wrong password" : "Sign-in unavailable";
                } catch {
                    error.textContent = "Sign-in unavailable";
                }
            });
        </script>
    </body>
</html>
